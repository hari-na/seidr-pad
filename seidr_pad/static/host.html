<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/seidr-pad.ico">
<title>Seidr Pad Host</title>
<style>
  :root { --bg: #0e0f12; --panel: #1b1d23; --edge: #2c2f38; --text: #e8e9ec; --dim: #8a8e99; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, "Segoe UI", sans-serif;
         min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  main { display: flex; gap: 48px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .qr { background: #fff; padding: 16px; border-radius: 16px; }
  .qr img { display: block; width: min(60vh, 80vw); height: auto; }
  h1 { margin: 0 0 4px; font-size: 32px; }
  .url { color: var(--dim); font-size: 20px; margin: 0 0 24px; word-break: break-all; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  li { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--edge);
       border-radius: 12px; padding: 12px 18px; font-size: 22px; min-width: 260px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--edge); }
  .p { font-weight: 800; width: 40px; }
  .nm { font-weight: 600; }
  .st { color: var(--dim); margin-left: auto; }
</style>
</head>
<body>
<main>
  <div class="qr"><img src="/qr.svg" alt="QR code for the controller page"></div>
  <div>
    <h1>Scan to join</h1>
    <p class="url" id="url"></p>
    <ul id="players"></ul>
  </div>
</main>
<script>
  const COLORS = ["#4f8cff", "#e8574f", "#5ac85a", "#f2c230"];
  async function tick() {
    try {
      const r = await fetch("/api/status");
      const d = await r.json();
      document.getElementById("url").textContent = d.url;
      const list = document.getElementById("players");
      list.replaceChildren(...d.players.map((p) => {
        const st = p.connected ? "connected" : p.held ? "reconnecting..." : "open";
        const dot = p.connected ? COLORS[p.slot - 1] : p.held ? "#8a8e99" : "";
        const li = document.createElement("li");
        li.innerHTML = `<span class="dot" style="${dot ? "background:" + dot : ""}"></span>` +
                       `<span class="p">P${p.slot}</span><span class="nm"></span><span class="st">${st}</span>`;
        li.querySelector(".nm").textContent = p.name || "";  // names come from phones: textContent only
        return li;
      }));
    } catch (_) {
      document.getElementById("players").innerHTML = "<li>Server stopped</li>";
    }
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
